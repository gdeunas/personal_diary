services:
  db:
    image: postgres:16
    platform: linux/amd64
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    restart: always
    # Ports are omitted because Celery communicates via internal Docker networking

  web:
    build: .
    restart: always
    # command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
     # - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
#    ports:
#      - 8000:8000

  celery:
    build: .
    restart: always
    command: celery -A config worker -l info
    volumes:
      # - .:/app
      - media_volume:/app/mediafiles # Shared if tasks process uploaded images
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    restart: always
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
#    volumes:
#      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
