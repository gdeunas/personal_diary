<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Личный Дневник{% endblock %}</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'diary/favicon.ico' %}"/>

    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="{% static 'diary/css/bootstrap.min.css' %}">
    <link href="https://cloudflare.com" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'entry_list' %}">📓 Мой Дневник</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                <span class="navbar-text me-3 text-white-50">Привет, {{ user.username }}</span>
                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Войти</a>
                    <a class="btn btn-warning btn-sm" href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
