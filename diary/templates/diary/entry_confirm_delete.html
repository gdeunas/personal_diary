{% extends 'diary/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body text-center">
                <h3 class="card-title text-danger mb-4">Удалить запись?</h3>
                <p>Вы уверены, что хотите безвозвратно удалить запись <strong>"{{ entry.title }}"</strong>?</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-around mt-4">
                        <a href="{% url 'entry_detail' entry.pk %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
