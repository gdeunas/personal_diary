name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/personal_diary]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Поднимаем PostgreSQL прямо в окружении GitHub Actions
    services:
      postgres_db:
        image: postgres:16
        env:
          POSTGRES_DB: test_diary_db
          POSTGRES_USER: test_diary_user
          POSTGRES_PASSWORD: test_diary_password
        # Маппим порт контейнера на хост-машину runner'а
        ports:
          - 5432:5432
        # Ждем, пока база данных будет готова принимать подключения
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: "ci-test-fake-secret-key-never-use-in-production"
      ALLOWED_HOSTS: "*"
      # Переменные для подключения Django к поднятому сервису Postgres
      DB_NAME: "test_diary_db"
      DB_USER: "test_diary_user"
      DB_PASSWORD: "test_diary_password"
      DB_HOST: "localhost" # Так как порт проброшен на хост, коннектимся к localhost
      DB_PORT: "5432"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy pytest-django
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Full PEP8 Linting (Flake8)
      run: flake8 .

    - name: Run Static Type Checking (Mypy)
      run: mypy .

    - name: Run Application Tests (on PostgreSQL)
      run: |
        python manage.py test

    - name: Test Docker Build
      run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/personal_diary'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/personal_diary
          # rm -rf sfc 
          
          # Если папки sfc еще нет (первый деплой), инициализируем репозиторий
          if [ ! -d "sfc/.git" ]; then
            git clone https://github.com/gdeunas/personal_diary.git sfc
          fi
          
          cd sfc
                   
          # Безопасно обновляем код без удаления папки проекта
          git fetch --all
          # git reset --hard origin/main # git pull origin feature/personal_diary
          git reset --hard origin/${{ github.ref_name }}
         
          echo "${{ secrets.ENV_FILE }}" > /opt/personal_diary/sfc/.env
          
          # Пересобираем и перезапускаем контейнеры с минимальным downtime
          docker compose down
          docker compose up -d --build --force-recreate
          
          # Применяем миграции и собираем статику внутри контейнера
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py collectstatic --noinput
