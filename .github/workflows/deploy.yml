name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/personal_diary]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Передаем фейковые переменные окружения, чтобы Django не падал при инициализации settings.py
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-test-fake-secret-key-never-use-in-production"
      ALLOWED_HOSTS: "*"
      NAME: "test_db"
      POSTGRES_DB: "test_db"
      USER: "test_user"
      POSTGRES_USER: "test_user"
      PASSWORD: "test_password"
      POSTGRES_PASSWORD: "test_password"
      HOST: "localhost"
      PORT: "5432"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy pytest-django
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Full PEP8 Linting (Flake8)
      run: |
        # Запускаем полную проверку стиля кода PEP8
        flake8 .

    - name: Run Static Type Checking (Mypy)
      run: |
        # Проверяем аннотации типов сущностей в моделях
        mypy .

    - name: Run Application Tests
      run: |
        # Запускаем наши 21 тест — теперь пайплайн не пропустит ошибки
        python manage.py test

    - name: Test Docker Build
      run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/${{ secrets.SERVER_USER }}/personal_diary
          git pull origin main
          echo "${{ secrets.ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py collectstatic --noinput
