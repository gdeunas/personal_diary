name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/personal_diary]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest-django
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Linting
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test Docker Build
      run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Деплой сработает только при пуше или слиянии в ветки main или master
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Переходим в актуальную папку проекта на сервере
          cd /home/${{ secrets.SERVER_USER }}/personal_diary
          
          # 2. Подтягиваем свежий код из репозитория
          git pull origin main
          
          # 3. Обновляем переменные окружения .env на сервере
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 4. Перезапускаем архитектуру контейнеров с новой сборкой
          docker compose down
          docker compose up -d --build
          
          # 5. Выполняем миграции БД и собираем статику Django внутри контейнера web
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py collectstatic --no-input
